name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Test, package, and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Validate the tag and release commit
        run: |
          node scripts/validate-release.mjs "$GITHUB_REF_NAME"
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the complete test suite
        run: npm test

      - name: Build the plugin package
        run: npm run package

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node --print "require('./package.json').version")"
          gh release create "$GITHUB_REF_NAME" \
            "release/better-immersivetranslate-v${VERSION}.zip" \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            --verify-tag
