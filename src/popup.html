<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>网页翻译</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="popup-header">
      <img class="popup-mark" src="icons/translation-48.png" alt="" />
      <div>
        <p class="eyebrow">BYOK WEB TRANSLATOR</p>
        <h1>网页沉浸式翻译</h1>
      </div>
    </header>
    <main>
      <section class="translate-panel" aria-labelledby="translate-title">
        <div class="section-heading">
          <span class="section-tag">即时操作</span>
          <p id="translate-title">保留原文，在段落下方显示译文。</p>
        </div>
        <button id="translate-current-page" type="button">翻译当前网页 <span aria-hidden="true">→</span></button>
      </section>
      <fieldset>
        <legend>阅读方式</legend>
        <button
          type="button"
          data-reading-mode="bilingual"
          aria-pressed="true"
        >
          双语对照
        </button>
        <button
          type="button"
          data-reading-mode="translation-only"
          aria-pressed="false"
        >
          仅译文
        </button>
        <button
          type="button"
          data-reading-mode="original-only"
          aria-pressed="false"
        >
          仅原文
        </button>
      </fieldset>
      <button id="open-llm-configuration" type="button">
        <span>LLM 配置</span><span aria-hidden="true">›</span>
      </button>
      <p id="popup-status" aria-live="polite"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
